name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# vcpkg 二进制缓存：用 files 后端 + actions/cache（路径见 job 级 env）。
# 旧的 "x-gha" 后端依赖 ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN，
# 这两个变量 GitHub 已经不再注入到 workflow 的 env 里，所以每次都冷编译
# （CommonLibSSE-NG 从源码编一次要 10 分钟以上）。
jobs:
  build-windows:
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 只打印环境信息，方便排查；失败不影响后续步骤
      - name: 诊断 —— 列出 runner 上的 Visual Studio / CMake / Ninja
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "===== CMake ====="
          cmake --version
          Write-Host "===== Ninja ====="
          ninja --version
          Write-Host "===== vswhere 能看到的 Visual Studio 实例 ====="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -products * -format json |
              ConvertFrom-Json |
              Select-Object displayName, installationVersion, installationPath |
              Format-List
          } else {
            Write-Host "vswhere.exe 不存在"
          }
          Write-Host "===== 诊断时的 VCPKG_ROOT ====="
          Write-Host "VCPKG_ROOT = $env:VCPKG_ROOT"

      - name: 缓存 vcpkg 二进制包（命中后配置阶段从 ~10 分钟降到 1 分钟内）
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          # 三元组与 vcpkg 清单变了就重新开一份缓存，避免读到不匹配的二进制
          key: vcpkg-bincache-${{ runner.os }}-x64-windows-static-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-x64-windows-static-

      # ⚠ 顺序很关键，不要和下面的「安装 vcpkg」调换。
      # msvc-dev-cmd 内部会调 vcvarsall，而 VS 2026 的 vcvarsall 会把 VCPKG_ROOT
      # 改写成 VS 自带的 vcpkg（C:\Program Files\Microsoft Visual Studio\18\...\VC\vcpkg）。
      # 若这一步放在 run-vcpkg 之后，正确路径就会被覆盖，run-cmake 会报
      # "Could not locate a manifest (vcpkg.json) above the current working directory."
      - name: 启用 MSVC x64 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # 与 vcpkg.json 的 builtin-baseline 保持一致
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          vcpkgJsonGlob: 'vcpkg.json'

      # 不写死 generator 版本号：2026 年的 runner 上是 VS 2026（主版本 18），
      # 写 "Visual Studio 17 2022" 会直接报 "could not find any instance of Visual Studio"。
      # 用 Ninja + 显式注入的 MSVC 环境，与 VS 版本彻底解耦。
      - name: 配置并编译
        uses: lukka/run-cmake@v10
        env:
          # 双保险：vcvarsall 会污染这个变量，这里显式指回 run-vcpkg 克隆的目录
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: 'ninja'
          buildPreset: 'ninja-release'

      - name: 准备 Python（体检脚本用，纯标准库）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 体检编译产物（导出符号 / 运行库口径 / 意外依赖）
        run: |
          python tools/pe_info.py --strict dist/SKSE/Plugins/EEA_Native.dll
        # --strict 会在下面任一条不满足时让本步骤失败，避免把「装进游戏加载不了」
        # 的 DLL 当成成功产物上传：
        #   · 缺 SKSEPlugin_Version / SKSEPlugin_Load
        #   · 链了调试版 CRT
        #   · 依赖了 fmt.dll / spdlog.dll 之类需要随包分发的第三方 DLL
        #     （vcpkg 动态三元组 x64-windows 会这样，必须用 x64-windows-static）

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: EEA_Native
          if-no-files-found: error
          path: |
            dist/SKSE/Plugins/EEA_Native.dll
            dist/SKSE/Plugins/EEA_Native.ini
            dist/**/*.pdb
