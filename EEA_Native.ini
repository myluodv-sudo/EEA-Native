; ============================================================
;  EEA_Native —— 动态增强敌人属性（原生 SKSE 插件版）
;  键名与原作者 MCM 的 settings.ini 完全一致，可直接把旧文件改名沿用。
;  游戏内按 DELETE 打开「模组控制面板」即可实时修改，无需手改本文件。
; ============================================================

[Main]
; 总开关
bEEASwitchMOD=1
; 生效的最低等级（原版把 GetLevel > 9 烘焙在 ESP 里，这里可调）
minLevel=10
; 是否也强化玩家本人
bAffectPlayer=0
; Boss 额外加成开关 / Boss 体型增量
bEEASwitchBoss=1
fEEABossScale=0.10

[HP]
; 生命强化开关
bEEASwitchHP=1
; 基础百分比：每 1 点 = 额外 1%
iExtrapctHP=20
; 叠加玩家等级 / 叠加敌人等级
bPCLevelSwitchHP=1
bELevelSwitchHP=1
; 额外倍率 / Boss 倍率
fExtraMultHP=1.0
fBossMultHP=2.0

[MP]
; 法力强化开关
bEEASwitchMP=0
iExtrapctMP=20
bPCLevelSwitchMP=1
bELevelSwitchMP=1
fExtraMultMP=1.0
fBossMultMP=2.0

[SP]
; 体力强化开关
bEEASwitchSP=0
iExtrapctSP=20
bPCLevelSwitchSP=1
bELevelSwitchSP=1
fExtraMultSP=1.0
fBossMultSP=2.0

[ATK]
; 攻击力强化开关（走 ActorValue AttackDamageMult）
bEEASwitchATK=0
iExtrapctATK=20
bPCLevelSwitchATK=1
bELevelSwitchATK=1
fExtraMultATK=1.0
fBossMultATK=2.0

[MGC]
; 法术强度强化开关（走 ActorValue LockpickingPowerMod，与原 MOD 同机制）
bEEASwitchMGC=0
iExtrapctMGC=20
bPCLevelSwitchMGC=1
bELevelSwitchMGC=1
fExtraMultMGC=1.0
fBossMultMGC=2.0

[Filter]
; 排除随从 / 排除召唤物（默认都包含 —— 与原 MOD「含友军」版一致）
; 原版「不含友军」版的做法是 IsHostileToActor(Player)==1 且 GetShouldHelp(Player)==0，
; 「含友军」版把这两条从五个属性块里删掉了。想要原版行为就把下面两个都改成 1。
bExcludeFollowers=0
bExcludeSummons=0

; 排除随从时，是否同时用「定义层派系」判定（更彻底）。
; 运行时的 IsPlayerTeammate() 只认「此刻已经被招募」的随从；改成派系判定后，
; 连「将来可能被招募」的 NPC 也一并排除，不受当前招募状态影响。
; 用到的两条原版派系（已实解 Skyrim.esm 确认）：
;   PotentialFollowerFaction 0x0005C84D  —— 43 条 NPC_ 带它
;   CurrentFollowerFaction   0x0005C84E  —— 40 条
; （顺带一提：NPC_ 的派系写在 SNAM 子记录里，不是 FACT）
bFollowerCheckByFaction=1

; ============================================================
;  定义层过滤器 —— 参照 Dynamic NPC Scaling（Nexus 180306）的 [SkipFlags]
; ============================================================
; 下面这组判据全部落在「ActorBase（NPC_ 记录）的 ACBS 标志位」上，也就是
; 「这个 NPC 属于哪一类」而不是「这一份实例现在什么状态」。好处：
;   · 结论稳定：招募 / 复活 / 读档 / 换地点都不会改变判定
;   · 开销近乎为零：只是内存里的几次位测试，不依赖运行时 EditorID
; 默认全部 0 —— 保持原 MOD「含友军」版行为，谁都不额外排除。
;
; 位值以 CommonLibSSE-NG 的 RE::ACTOR_BASE_DATA::Flag 为权威来源
; （UESP 网页把 PCLevelMult 标成 0x40 是错的，正确是 0x80）。
;
; 实测本机整合包 35,905 条 NPC_ 的分布：
;   Unique 19.4% / Essential 6.5% / Protected 2.0% / Invulnerable 2.4% /
;   Summonable 7.7% / UseTemplate 2.0%
;
; ⚠ 玩家本体那条 NPC_（0x00000007 "Player"，ACBS=0x30）就带 Unique 标志。
;   但本插件对玩家的排除是**独立且无条件**的（除非 bAffectPlayer=1），
;   不依赖任何一个过滤器开关 —— 所以关掉 bSkipUnique 也不会让玩家中招。
bSkipUnique=0
bSkipEssential=0
bSkipProtected=0
bSkipInvulnerable=0
bSkipSummonable=0
; 用模板（TPLT）/ 捏脸预设的 NPC：自身不持有真正的数值，改它们的 base AV 多半白改
bSkipTemplated=0

; 龙类是否排除在「属性强化」之外。
; 原版 ESP 在法术条件里放了 HasKeyword(ActorTypeDragon)==0 和 GetIsClass(EncClassDragon)==0，
; 所以原版龙根本吃不到属性加成 —— Nexus 上「龙不受影响」的反馈就是这条造成的。
; 1 = 保持原版行为（默认）；0 = 龙也强化。
bExcludeDragons=1
sDragonKeywords=ActorTypeDragon
sDragonClasses=EncClassDragon
; Boss 体型增量是否跳过龙类（龙的速度会被体型放大，原作者也建议对龙关掉）
bSkipBossScaleOnDragons=1

; ---- Boss 判定（三级，精确度递减）----
; 三种判据的精确度差别极大。用本机整合包 35,904 个 NPC_ 实测（tools/boss_scan.py）：
;
;   (1) LocationRefType "Boss"   高  原版机制，需 CK 手工标记，准但覆盖面小
;   (2) EditorID 含 "Boss"       中  命中 3,508 个（9.8%）
;   (3) AI 数据                  低  命中 15,097 个（42%）
;                                    大量 mod 给所有战斗单位都设了
;                                    VeryAggressive + Foolhardy
;
; 对 TrueHUD 那种「只决定显不显示血条」的用途判宽无妨；但对属性加成，
; 第 (3) 条会让 38% 的敌人吃上 Boss 倍率，Boss 设定直接失去意义。故默认只开 (1)(2)。

; (1) 原版机制：Skyrim.esm 里 EDID 为 Boss、FormID 0x000130F7 的 LocationRefType
;     （已实解确认，记录类型 LCRT）。它描述的是「某地点的某放置参照物扮演的角色」，
;     不是 Actor 关键字，更不是「FormID 里带 BOSS」。
bBossUseLocRefType=1
sLocRefTypeBoss=Boss

; (2) EditorID（CK 里的记录名，如 dunHalldirsBoss）含下列片段即算 Boss。
;     注意 EDID 与 FormID 是两回事：FormID 是加载时分配的数字，没有语义。
;     前提：Skyrim 运行时默认不保留 EDID。首次启动请看日志 ——
;     若出现「运行时取不到 EditorID」，需要安装 Native EditorID Fix 之类的插件，
;     或把 bBossUseEditorID 改为 0。
bBossUseEditorID=1
sBossEdidPatterns=Boss

; (3) AI 数据：Aggression >= iBossMinAggression 且 Confidence >= iBossMinConfidence。
;     Aggression 取值 0-3（0=不主动,1=主动,2=很主动,3=狂暴）
;     Confidence 取值 0-4（0=胆小 .. 4=鲁莽）
;     实测过于宽泛，默认关闭。开了请自行承担「遍地 Boss」的后果。
bBossUseAIData=0
iBossMinAggression=2
iBossMinConfidence=4

; (4) 显式名单兜底。注意 vanilla 并没有 ActorTypeBoss 这类关键字（已扫过
;     Skyrim.esm 全部 KEYM 确认），所以关键字默认留空。
sBossKeywords=
sBossRaces=DragonPriestRace
sBossNpcs=

[Magic]
; 法术强度实现方式： Perk = 用 ESP 里的 EEA_EnhanceMGCPerk（原作者机制，需要 EnhanceEnemyAttributes.esp）
;                   PowerMod = 纯 DLL，直接加成五大法术学派 PowerModifier，不需要任何插件
;                   Both = 两者都开
sMode=Perk
sPerkPlugin=EnhanceEnemyAttributes.esp
sPerkEditorID=EEA_EnhanceMGCPerk

[Menu]
bEnabled=1
sSectionName=敌人属性增强

[Perf]
; 每帧最多处理几个单位（跨帧摊平，防止进地牢瞬间卡顿）
iProcessPerTick=6

; 单位一加载就立即强化（与原版 Papyrus 一致：不进入战斗也加成）。
; 已强化过的单位保持幂等刷新 —— 数值没变就完全不碰引擎。
;
; 注：早期版本有一个 iTriggerMode（0=加载即强化 / 1=仅进入战斗时强化）开关，
; 已被彻底移除。原因：原版本来就是「不进入战斗也加成」，那个开关既不符合原版行为，
; 又会造成「在菜单里改了设置却看不到变化」（自动路径被它门控）。
; 现在加载、战斗、手动刷新走同一条路径，行为与 Papyrus 版一致。

; ---- 改设置时的屏幕提示（对应原版 Papyrus 的 Debug.Notification）----
; 原版在 MCM 改设置时会先弹「正在更新敌人属性」、全部重算完再弹「敌人属性已更新」。
; 1 = 打开（默认，与原版一致）；0 = 关闭提示
; 用的就是同一个引擎通知接口（RE::DebugNotification），显示位置与原版一模一样。
bNotifyOnRefresh=1

; ---- 改上限时是否保持当前值百分比（仅生命 / 法力 / 体力）----
; 1 = 保持（推荐）：
;     · 满血敌人首次强化后仍是满血（看起来"变强了"）
;     · 被扣过血的敌人仍按原比例，不会借机回血
;     · 战斗中修改设置，血量百分比不动 —— 这就是「回满血」被根治的地方
; 0 = 完全交给引擎
bPreserveCurrentRatio=1

; ---- 属性写在哪个 modifier 桶 ----
; 【本版本固定为永久修正：这一项已失效，保留键名仅为兼容旧 INI】
; 原因：CommonLibSSE-NG 3.7.0 的 ActorValueOwner 只暴露两个 AV 写接口 ——
;   ModActorValue(ActorValue, float)                           改「永久修正」
;   RestoreActorValue(ACTOR_VALUE_MODIFIER, ActorValue, float)  改指定桶
; 没有「带桶的 ModActorValue」，所以属性上限只能写在永久修正上。
; 好在 2 参数的 ModActorValue 恰好就是原版 Papyrus 的 ModAV，也就是原作者脚本用的那个。
; 数值随存档保存，读档后插件「认领」而不是「撤销」，因此残血敌人读档后不会被扣死。
; 卸载插件前请先在菜单点一次「还原所有单位」。
; 改成 1 也不生效，只会在日志里留一条提示。
bUseTemporaryModifier=0

bVerboseLog=0
bLogFirstApply=1

[Debug]
bTraceValues=0
